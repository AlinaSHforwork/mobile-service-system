repos:
  # 1. Стандартні перевірки (відступи, пусті рядки, валідність YAML)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000'] # Забороняє файли > 1MB
      - id: detect-private-key # Блокує приватні ключі

  # 2. Локальні хуки (Специфічні для вашого проекту)
  - repo: local
    hooks:
      # Заборона коміту будь-яких .env файлів
      - id: forbid-env
        name: Block .env files
        entry: "❌ ERROR: Do not commit .env files!"
        language: fail
        files: '\.env.*$|\.env$' # Регулярний вираз для .env, .env.local тощо

      # Запуск лінтера для Frontend
      - id: next-lint
        name: Next.js Lint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        types: [javascript, jsx, ts, tsx]
        pass_filenames: false # Запускаємо lint на весь проект, а не пофайлово

  # 3. ESLint для перевірки JS/TS файлів
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.11.1
    hooks:
      - id: eslint
        files: \.[jt]sx?$  # фільтрує .js, .ts, .jsx, .tsx
        types: [file]
        args: [--fix]
        # Додаткові залежності, якщо ваш eslint-конфіг потребує плагінів
        additional_dependencies:
          - eslint@8.56.0
          - eslint-plugin-react@latest
          - eslint-config-standard@latest
          - eslint-plugin-import@latest
          - eslint-plugin-node@latest
          - eslint-plugin-promise@latest
          - eslint-plugin-jsx-a11y@latest
